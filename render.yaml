# Render Blueprint — deploy apps/backend with one click
# https://render.com/docs/blueprint-spec

services:
  - name: mogbank-api
    type: web
    env: docker
    region: singapore
    plan: starter
    dockerContext: .
    dockerfilePath: apps/backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Supabase connection pooler (transaction mode) — Singapore region
      - key: DB_HOST
        value: "aws-0-ap-southeast-1.pooler.supabase.com"
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        value: "postgres.mkushvohaysmlrbdwcom"
      - key: DB_PASSWORD
        sync: false   # set in Render dashboard: Supabase project password
      - key: DB_SSL
        value: "true"
      # Redis is optional — the server boots and runs without it.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false   # set in Render dashboard: any long random string
      - key: CORS_ORIGINS
        value: "https://mogbank.vercel.app"
      - key: X402_ENABLED
        value: "true"
      - key: ETH_RPC_URL
        value: "https://mainnet.base.org"
      - key: ETH_CHAIN_ID
        value: "8453"
      - key: DDSC_ENABLED
        value: "false"
    autoDeploy: true