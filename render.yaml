# Render Blueprint — native Node.js (no Docker)
# https://render.com/docs/blueprint-spec

services:
  - name: mogbank-api
    type: web
    env: node
    region: singapore
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Supabase connection pooler (transaction mode)
      - key: DB_HOST
        value: "aws-0-ap-southeast-1.pooler.supabase.com"
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        value: "postgres.mkushvohaysmlrbdwcom"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      # Redis is optional — server boots without it
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://mogbank.vercel.app"
      - key: X402_ENABLED
        value: "true"
      - key: ETH_RPC_URL
        value: "https://mainnet.base.org"
      - key: ETH_CHAIN_ID
        value: "8453"
      - key: DDSC_ENABLED
        value: "false"
    autoDeploy: true
